name: Release artifacts

on:
  workflow_call:
    inputs:
      tag:
        description: Tag de la release que recibe los assets
        required: true
        type: string

permissions:
  contents: read

jobs:
  bundle:
    name: bundle (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
          - runner: macos-14
            platform: macos-x64
          - runner: macos-14-arm64
            platform: macos-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: scripts/build/node-version.txt
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Construir el bundle con el Node oficial
        run: npm run standalone -- --node-source official
      - name: Verificar el artefacto y su checksum
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -eu
          version="$(node -p "require('./package.json').version")"
          asset="media-manager-cli-${version}-${PLATFORM}.tar.gz"
          test -f "build/standalone/${asset}"
          test -f "build/standalone/${asset}.sha256"
          (cd build/standalone && sha256sum -c "${asset}.sha256")
      - name: Atestar la procedencia
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: build/standalone/*.tar.gz
      - name: Verificar la atestación
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation verify build/standalone/*.tar.gz --repo "${{ github.repository }}"
      - name: Publicar los assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release upload "${{ inputs.tag }}" \
            build/standalone/*.tar.gz \
            build/standalone/*.sha256 \
            --repo "${{ github.repository }}"

  install-test:
    name: install (${{ matrix.os }}, sin Node)
    needs: bundle
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: ubuntu
            use-docker: 'true'
          - os: macos-14
            label: macos
            use-docker: 'false'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Instalar y desinstalar desde la release (Linux)
        if: matrix.use-docker == 'true'
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -eu
          docker run --rm \
            -e TAG="$TAG" \
            -v "$PWD/install.sh:/install.sh:ro" \
            -v "$PWD/uninstall.sh:/uninstall.sh:ro" \
            ubuntu:24.04 bash -eu -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y -qq curl ca-certificates tar gzip >/dev/null
              if command -v node >/dev/null 2>&1; then
                echo "El contenedor no debe tener Node" >&2
                exit 1
              fi
              mkdir -p /root/.config/media-manager
              printf "version: 1\n" > /root/.config/media-manager/config.yaml
              sh /install.sh --version "$TAG" --prefix /root/.local --no-path-check
              test -x /root/.local/bin/mm
              /root/.local/bin/mm --version
              if command -v node >/dev/null 2>&1; then
                echo "El bundle no debe exponer Node en PATH" >&2
                exit 1
              fi
              sh /uninstall.sh --prefix /root/.local --yes
              test -f /root/.config/media-manager/config.yaml
            '
      - name: Instalar y desinstalar desde la release (macOS)
        if: matrix.use-docker == 'false'
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -eu
          # macOS runner no tiene Node preinstalado en la imagen base
          if command -v node >/dev/null 2>&1; then
            echo "El runner no debe tener Node" >&2
            exit 1
          fi
          mkdir -p "$HOME/.config/media-manager"
          printf "version: 1\n" > "$HOME/.config/media-manager/config.yaml"
          sh ./install.sh --version "$TAG" --prefix "$HOME/.local" --no-path-check
          test -x "$HOME/.local/bin/mm"
          "$HOME/.local/bin/mm" --version
          if command -v node >/dev/null 2>&1; then
            echo "El bundle no debe exponer Node en PATH" >&2
            exit 1
          fi
          sh ./uninstall.sh --prefix "$HOME/.local" --yes
          test -f "$HOME/.config/media-manager/config.yaml"

  sbom:
    name: sbom (CycloneDX)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: scripts/build/node-version.txt
          cache: npm
      - run: npm ci
      - name: Generar el SBOM
        run: npm sbom --omit=dev --sbom-format=cyclonedx > sbom.cdx.json
      - name: Validar el SBOM
        run: node -e "const data = require('./sbom.cdx.json'); if (data.bomFormat !== 'CycloneDX') process.exit(1)"
      - name: Publicar el SBOM
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" sbom.cdx.json --repo "${{ github.repository }}"
